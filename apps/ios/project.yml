name: AirFerryIOS
options:
  bundleIdPrefix: local.airferry
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  AirFerryIOS:
    type: application
    platform: iOS
    sources:
      - path: AirFerryIOS
        excludes:
          - Resources/Info.plist
    info:
      path: AirFerryIOS/Resources/Info.plist
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: local.airferry.ios
        PRODUCT_NAME: AirFerry
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: Native/AirFerryCore.xcframework
        embed: false
